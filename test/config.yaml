# Application configuration
# Demonstrates: anchors, aliases, multi-line strings, nested maps, comments.

app:
  name: vagari
  version: "0.4.0"
  debug: false
  log_level: info  # debug | info | warn | error

# Shared defaults via anchors
defaults: &defaults
  timeout: 30s
  retries: 3
  backoff:
    initial: 100ms
    max: 5s
    multiplier: 2.0

# Database configuration
database:
  primary: &db_primary
    host: localhost
    port: 5432
    name: vagari_prod
    ssl_mode: require
    pool:
      min_connections: 5
      max_connections: 20
      max_lifetime: 1800s
    <<: *defaults

  replica:
    <<: *db_primary
    host: replica.internal
    name: vagari_replica
    pool:
      min_connections: 2
      max_connections: 10

# Server configuration
server:
  http:
    listen: "0.0.0.0:8080"
    read_timeout: 10s
    write_timeout: 30s
    idle_timeout: 120s
    max_header_bytes: 1048576  # 1 MB

  grpc:
    listen: "0.0.0.0:9090"
    max_recv_msg_size: 4194304  # 4 MB

  tls:
    enabled: true
    cert_file: /etc/ssl/certs/server.pem
    key_file: /etc/ssl/private/server.key
    min_version: "1.3"

# Feature flags
features:
  - name: dark-mode
    enabled: true
    rollout_percentage: 100

  - name: ai-assist
    enabled: false
    rollout_percentage: 0
    allowed_users:
      - user-001
      - user-002

  - name: new-editor
    enabled: true
    rollout_percentage: 25
    description: >
      Experimental editor with tree-sitter
      based syntax highlighting and improved
      performance for large files.

# Multi-line strings
templates:
  welcome: |
    Welcome to Vagari!

    Your account has been created successfully.
    Please verify your email to get started.

  error: >-
    An unexpected error occurred while processing
    your request. Please try again later or contact
    support if the issue persists.

# Environment-specific overrides
environments:
  development:
    <<: *defaults
    timeout: 60s
    database:
      host: localhost
      ssl_mode: disable

  staging:
    <<: *defaults
    database:
      host: staging-db.internal

  production:
    <<: *defaults
    retries: 5
    database:
      host: prod-db.internal
      ssl_mode: verify-full

# Monitoring
monitoring:
  metrics:
    enabled: true
    port: 9100
    path: /metrics
    labels:
      service: vagari
      team: platform

  tracing:
    enabled: true
    sampler: probabilistic
    sample_rate: 0.1
    endpoint: https://jaeger.internal:14268/api/traces
