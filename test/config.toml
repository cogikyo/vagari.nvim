# Project configuration
# Demonstrates: tables, inline tables, arrays of tables, dates, multi-line strings.

[package]
name = "vagari"
version = "0.4.0"
edition = "2024"
authors = ["Alice <alice@example.com>", "Bob <bob@example.com>"]
description = """
A carefully crafted colorscheme for Neovim \
with full treesitter support and accessible \
contrast ratios."""
license = "MIT"
repository = "https://github.com/example/vagari"
keywords = ["colorscheme", "neovim", "theme"]
categories = ["development-tools", "text-editors"]
publish = true

[package.metadata]
created = 2024-01-15
updated = 2024-12-01T10:30:00Z

# Dependencies with various version specifiers
[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"], optional = true }
log = "0.4"
thiserror = "1.0"

[dependencies.reqwest]
version = "0.12"
features = ["json", "rustls-tls"]
default-features = false

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
insta = "1.34"
tempfile = "3"

[build-dependencies]
cc = "1.0"

# Feature flags
[features]
default = ["runtime-tokio"]
runtime-tokio = ["dep:tokio"]
full = ["runtime-tokio", "tracing"]
tracing = []

# Build profiles
[profile.dev]
opt-level = 0
debug = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.bench]
inherits = "release"
debug = true

# Binary targets
[[bin]]
name = "vagari"
path = "src/main.rs"

[[bin]]
name = "vagari-cli"
path = "src/cli.rs"
required-features = ["runtime-tokio"]

# Example entries
[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "advanced"
path = "examples/advanced.rs"
required-features = ["full"]

# Workspace configuration
[workspace]
members = [
  "crates/core",
  "crates/parser",
  "crates/renderer",
]
resolver = "2"

[workspace.dependencies]
vagari-core = { path = "crates/core", version = "0.4" }

# Inline table examples
[tool.formatting]
indent = { style = "spaces", width = 4 }
line_width = 100
quote_style = "double"

# Environment variables
[env]
DATABASE_URL = "postgresql://localhost/vagari"
RUST_LOG = "vagari=debug,tower_http=debug"
PORT = "8080"
