# Docker Compose: services, networks, volumes, healthchecks, profiles.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: "${VERSION:-dev}"
        COMMIT_SHA: "${COMMIT_SHA:-local}"
    image: vagari/api:${VERSION:-latest}
    container_name: vagari-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
      - "9090:9090"
    environment:
      DATABASE_URL: postgres://vagari:${DB_PASSWORD}@postgres:5432/vagari?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    env_file:
      - .env
      - .env.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "/server", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend
    volumes:
      - ./config:/etc/vagari:ro
      - app-data:/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 128M

  worker:
    build:
      context: .
      target: builder
    command: ["./worker", "--concurrency", "4"]
    restart: unless-stopped
    profiles:
      - full
    environment:
      DATABASE_URL: postgres://vagari:${DB_PASSWORD}@postgres:5432/vagari?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - api
      - redis
    networks:
      - backend

  postgres:
    image: postgres:16-alpine
    container_name: vagari-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vagari
      POSTGRES_USER: vagari
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vagari"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - backend
    shm_size: 256mb

  redis:
    image: redis:7-alpine
    container_name: vagari-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend

  nginx:
    image: nginx:1.25-alpine
    container_name: vagari-proxy
    restart: unless-stopped
    profiles:
      - full
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - backend
      - frontend

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  app-data:

networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
